services:
  main:
    build:
      context: ./main
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 80
      BASE_URL: ${BASE_URL:-http://localhost}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-http://localhost}
      PUBLIC_UPLOADS_URL: ${PUBLIC_UPLOADS_URL:-}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      NODE_ENV: production
    expose:
      - "80"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_URL: ${ADMIN_APP_URL:-http://localhost}
      APP_VERSION: ${APP_VERSION:-2.4.0}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CLIENT: phpredis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      UPLOADS_DISK_DRIVER: ${UPLOADS_DISK_DRIVER:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_URL: ${AWS_URL:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}
    expose:
      - "80"
