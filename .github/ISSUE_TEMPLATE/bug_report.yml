name: Bug report
description: Something on the public site, the panel or the MCP endpoint is not working
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Close this and email **security@dansday.com** — see [SECURITY.md](https://github.com/dansday-com/dansday-main/blob/master/SECURITY.md). Do not post it here.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest version, or I checked that the fix is not already on `master`.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Self-hosted with Docker Compose
        - Self-hosted without Docker
        - Local development
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version at the bottom of the README, or `APP_VERSION` in your environment.
      placeholder: 2.5.0
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      description: Pick every part that is involved.
      multiple: true
      options:
        - Public site — home, articles, projects, abouts
        - Public site — terminal
        - Public site — contribute and GitHub stats
        - Panel — login and settings
        - Panel — pages and content editing
        - Panel — AI generation
        - MCP endpoint or tokens
        - MCP uploads
        - LinkedIn — connection, posting or scheduling
        - Uploads, S3 or R2
        - Database, schema or migrations
        - Translations
        - Docker, deployment or self-hosting
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel at ...
        2. Go to ...
        3. Click ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: From `docker compose logs`, `storage/logs` or the browser console. Redact tokens, API keys and database credentials before pasting.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP and Node versions, MySQL, Redis, reverse proxy, and the MCP client if one is involved. For site or panel bugs, add your browser and OS.
      placeholder: |
        PHP 8.5, Node 25, MySQL 8.4, Redis 7, docker compose behind Caddy
        Claude Code as the MCP client
        Firefox 145 on Windows 11

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a short clip, or how often it happens.
