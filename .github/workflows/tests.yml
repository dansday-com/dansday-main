name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  admin:
    name: Admin (PHP)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dansday_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dansday_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, zip, gd, xml, mbstring, redis, opentelemetry, opcache, fileinfo
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: admin/vendor
          key: composer-${{ hashFiles('admin/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: admin
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        working-directory: admin
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        working-directory: admin
        run: php artisan migrate --force

      - name: Run tests
        working-directory: admin
        run: php vendor/bin/phpunit

  main:
    name: Site (SvelteKit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Check formatting
        working-directory: main
        run: npx prettier --check .

      - name: Build
        working-directory: main
        run: |
          npm run build:sync
          npm run build
